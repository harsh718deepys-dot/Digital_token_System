# Server
server.port=${PORT:8080}

# Database (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:tokenqueuedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (Base64 encoded secure string for demo)
app.jwt.secret=94a08da1fecbb6e8b46990538c7b50b240cebc1c33c2a688b77a06669930f40d
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
